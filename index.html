<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW1 尾牙活動報到抽獎</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #07090e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    /* === 強化版動態神祕煙霧層 === */
    .fog-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .fog-blob {
      position: absolute;
      filter: blur(48px);
      will-change: transform, opacity;
      mix-blend-mode: screen;
    }

    /* 煙霧 1：台達科技藍 */
    .fog-1 {
      width: 460px;
      height: 300px;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      background: radial-gradient(ellipse at center, rgba(0, 150, 255, 0.7) 0%, rgba(0, 80, 180, 0.25) 50%, rgba(0, 0, 0, 0) 75%);
      top: 50%;
      left: 50%;
      margin-top: -220px;
      margin-left: -280px;
      animation: swirl1 7s ease-in-out infinite alternate;
    }

    /* 煙霧 2：神祕靛紫 */
    .fog-2 {
      width: 500px;
      height: 320px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      background: radial-gradient(ellipse at center, rgba(130, 50, 255, 0.65) 0%, rgba(65, 20, 150, 0.25) 50%, rgba(0, 0, 0, 0) 75%);
      top: 50%;
      left: 50%;
      margin-top: -100px;
      margin-left: -180px;
      animation: swirl2 8.5s ease-in-out infinite alternate;
    }

    /* 煙霧 3：冷冽青霧 */
    .fog-3 {
      width: 560px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 225, 255, 0.5) 0%, rgba(0, 120, 160, 0.15) 55%, rgba(0, 0, 0, 0) 75%);
      top: 50%;
      left: 50%;
      margin-top: -110px;
      margin-left: -280px;
      animation: sweep 6s ease-in-out infinite alternate;
    }

    @keyframes swirl1 {
      0%   { transform: translate3d(-110px, -80px, 0) rotate(0deg) scale(0.9, 1.1);   opacity: 0.55; }
      50%  { transform: translate3d(80px, -20px, 0) rotate(75deg) scale(1.25, 0.9);  opacity: 0.85; }
      100% { transform: translate3d(-40px, 100px, 0) rotate(140deg) scale(1.0, 1.2); opacity: 0.6; }
    }

    @keyframes swirl2 {
      0%   { transform: translate3d(110px, 80px, 0) rotate(0deg) scale(1.1, 0.9);     opacity: 0.5; }
      50%  { transform: translate3d(-90px, 30px, 0) rotate(-80deg) scale(0.95, 1.25); opacity: 0.8; }
      100% { transform: translate3d(50px, -110px, 0) rotate(-150deg) scale(1.2, 1.0); opacity: 0.55; }
    }

    @keyframes sweep {
      0%   { transform: translate3d(-160px, 40px, 0) rotate(-15deg) scaleX(0.9); opacity: 0.35; }
      50%  { transform: translate3d(0px, -50px, 0) rotate(10deg) scaleX(1.3);    opacity: 0.7; }
      100% { transform: translate3d(160px, 30px, 0) rotate(25deg) scaleX(0.95);  opacity: 0.4; }
    }

    /* === 手機版專屬煙霧強化（讓上下留白處明顯翻湧） === */
    @media (max-width: 600px) {
      .fog-blob {
        filter: blur(30px); /* 降低模糊，讓煙霧輪廓更清楚 */
      }
      .fog-1 {
        width: 300px;
        height: 200px;
        margin-top: -320px; /* 移到卡片上方區域 */
        margin-left: -150px;
        background: radial-gradient(ellipse at center, rgba(0, 160, 255, 0.85) 0%, rgba(0, 90, 200, 0.35) 50%, rgba(0, 0, 0, 0) 75%);
        animation: mobileSwirlTop 5.5s ease-in-out infinite alternate;
      }
      .fog-2 {
        width: 320px;
        height: 220px;
        margin-top: 120px; /* 移到卡片下方區域 */
        margin-left: -160px;
        background: radial-gradient(ellipse at center, rgba(145, 60, 255, 0.8) 0%, rgba(75, 20, 170, 0.35) 50%, rgba(0, 0, 0, 0) 75%);
        animation: mobileSwirlBottom 6.5s ease-in-out infinite alternate;
      }
      .fog-3 {
        width: 280px;
        height: 160px;
        margin-top: -80px;
        margin-left: -140px;
        background: radial-gradient(ellipse at center, rgba(0, 235, 255, 0.65) 0%, rgba(0, 130, 170, 0.25) 55%, rgba(0, 0, 0, 0) 75%);
        animation: mobileSweep 5s ease-in-out infinite alternate;
      }

      @keyframes mobileSwirlTop {
        0%   { transform: translate3d(-90px, -20px, 0) rotate(0deg) scale(0.85, 1.15); opacity: 0.6; }
        50%  { transform: translate3d(70px, 60px, 0) rotate(70deg) scale(1.2, 0.9);    opacity: 0.95; }
        100% { transform: translate3d(-40px, 110px, 0) rotate(130deg) scale(0.95, 1.1); opacity: 0.7; }
      }
      @keyframes mobileSwirlBottom {
        0%   { transform: translate3d(90px, 20px, 0) rotate(0deg) scale(1.1, 0.85);     opacity: 0.6; }
        50%  { transform: translate3d(-80px, -50px, 0) rotate(-75deg) scale(0.9, 1.2);  opacity: 0.95; }
        100% { transform: translate3d(40px, -110px, 0) rotate(-140deg) scale(1.15, 0.95); opacity: 0.65; }
      }
      @keyframes mobileSweep {
        0%   { transform: translate3d(-110px, -180px, 0) rotate(-20deg) scale(0.9); opacity: 0.4; }
        50%  { transform: translate3d(90px, 0px, 0) rotate(15deg) scale(1.25);      opacity: 0.85; }
        100% { transform: translate3d(-90px, 190px, 0) rotate(35deg) scale(0.95);   opacity: 0.5; }
      }
    }

    /* === 主卡片（毛玻璃微光質感） === */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(20, 22, 28, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 35px rgba(0, 140, 255, 0.15);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .brand-header {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 32px;
    }
    .brand-logo {
      width: 95px;
      height: 32px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    .brand-text {
      font-size: 15px;
      font-weight: 600;
      color: #d0d4dc;
      line-height: 1.1;
      white-space: nowrap;
    }
    h2 { margin-top: 0; margin-bottom: 16px; font-size: 24px; letter-spacing: 1px; }
    #countdownBox {
      background-color: rgba(42, 36, 23, 0.85);
      border: 1px solid #665222;
      color: #ffd43b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.5;
      display: none;
    }
    #countdownTimer {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: block;
      margin-top: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background-color: rgba(44, 48, 58, 0.75);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 12px rgba(13, 110, 253, 0.35);
      outline: none;
    }
    input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0d6efd, #0052cc);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background: #444; color: #aaa; box-shadow: none; cursor: not-allowed; }
    #msg { margin-top: 20px; font-size: 16px; font-weight: bold; min-height: 24px; }
    .ok { color: #20c997; }
    .err { color: #ff6b6b; }
  </style>
</head>

    <h2>報到抽獎登記</h2>

    <div id="countdownBox">
      距離開放登記還有
      <span id="countdownTimer">計算中...</span>
    </div>

    <input type="text" id="empId" placeholder="請輸入您的工號" autocomplete="off">
    <button id="submitBtn" onclick="submitForm()">確認登記</button>
    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rsvdpldicrzpfajpugzl.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_hfNnuojQhFjjAvG4D1XwEA_Sj6iaZ4c';

    // ★ 設定開放時間（請與 Supabase SQL 設定一致）
    const OPEN_TIME = new Date('2026-12-20T17:00:00+08:00');
    const OPEN_TIME_TEXT = '12/20 17:00';

    const inputEl = document.getElementById('empId');
    const btnEl = document.getElementById('submitBtn');
    const msgEl = document.getElementById('msg');
    const countdownBox = document.getElementById('countdownBox');
    const countdownTimer = document.getElementById('countdownTimer');

    let isSubmitting = false;

    function updateCountdown() {
      const diff = OPEN_TIME - new Date();

      if (diff > 0) {
        countdownBox.style.display = 'block';
        inputEl.disabled = true;
        btnEl.disabled = true;
        btnEl.innerText = `將於 ${OPEN_TIME_TEXT} 開放`;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        const pad = (n) => String(n).padStart(2, '0');
        countdownTimer.innerText = days > 0
          ? `${days} 天 ${pad(hours)} 時 ${pad(minutes)} 分 ${pad(seconds)} 秒`
          : `${pad(hours)} 時 ${pad(minutes)} 分 ${pad(seconds)} 秒`;
      } else {
        countdownBox.style.display = 'none';
        inputEl.disabled = false;
        if (!isSubmitting) {
          btnEl.disabled = false;
          btnEl.innerText = '確認登記';
        }
        clearInterval(timerInterval);
      }
    }

    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown();

    inputEl.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && !btnEl.disabled) submitForm();
    });

    async function submitForm() {
      if (new Date() < OPEN_TIME) {
        msgEl.className = 'err';
        msgEl.innerText = `尚未開放登記，將於 ${OPEN_TIME_TEXT} 準時開放！`;
        return;
      }

      const empId = inputEl.value.trim().toUpperCase();
      if (!empId) {
        msgEl.className = 'err';
        msgEl.innerText = '請先輸入工號';
        return;
      }

      isSubmitting = true;
      btnEl.disabled = true;
      btnEl.innerText = '報到登記中...';
      msgEl.innerText = '';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/checkins`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ emp_id: empId })
        });

        if (response.status === 201) {
          msgEl.className = 'ok';
          msgEl.innerText = `工號 ${empId} 登記成功！祝您中獎！`;
          inputEl.value = '';
        } else if (response.status === 409) {
          msgEl.className = 'err';
          msgEl.innerText = `工號 ${empId} 已經登記過了，請勿重複送出！`;
        } else if (response.status === 403 || response.status === 401) {
          msgEl.className = 'err';
          msgEl.innerText = `目前尚未開放登記（開放時間：${OPEN_TIME_TEXT}）`;
        } else {
          msgEl.className = 'err';
          msgEl.innerText = `登記失敗 (錯誤碼 ${response.status})，請稍後再試`;
        }
      } catch (err) {
        msgEl.className = 'err';
        msgEl.innerText = '連線失敗，請檢查網路後再試一次';
      } finally {
        isSubmitting = false;
        if (new Date() >= OPEN_TIME) {
          btnEl.disabled = false;
          btnEl.innerText = '確認登記';
        }
      }
    }
  </script>
