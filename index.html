<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW1 尾牙活動報名抽獎 (測試)</title>

  <!-- LINE / Teams 連結預覽資訊 -->
  <meta property="og:title" content="TW1 尾牙活動報名與現場報到">
  <meta property="og:description" content="請輸入工號與姓名完成活動報名，活動當天現場掃描 QR Code 報到即可參加抽獎！">
  <meta property="og:type" content="website">

<!-- 瀏覽器分頁小圖示 (Favicon) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2300e1ff'/%3E%3Cstop offset='100%25' stop-color='%230066cc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='32,6 60,56 4,56' fill='url(%23g)'/%3E%3C/svg%3E">

  <script src="./html5-qrcode.min.js" defer></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #07090e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* === 彩帶特效畫布 === */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* === 強化版動態神祕煙霧層 === */
    .fog-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .fog-blob {
      position: absolute;
      filter: blur(48px);
      will-change: transform, opacity;
      mix-blend-mode: screen;
    }
    .fog-1 {
      width: 460px; height: 300px;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      background: radial-gradient(ellipse at center, rgba(0, 150, 255, 0.7) 0%, rgba(0, 80, 180, 0.25) 50%, rgba(0, 0, 0, 0) 75%);
      top: 50%; left: 50%; margin-top: -220px; margin-left: -280px;
      animation: swirl1 7s ease-in-out infinite alternate;
    }
    .fog-2 {
      width: 500px; height: 320px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      background: radial-gradient(ellipse at center, rgba(130, 50, 255, 0.65) 0%, rgba(65, 20, 150, 0.25) 50%, rgba(0, 0, 0, 0) 75%);
      top: 50%; left: 50%; margin-top: -100px; margin-left: -180px;
      animation: swirl2 8.5s ease-in-out infinite alternate;
    }
    .fog-3 {
      width: 560px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 225, 255, 0.5) 0%, rgba(0, 120, 160, 0.15) 55%, rgba(0, 0, 0, 0) 75%);
      top: 50%; left: 50%; margin-top: -110px; margin-left: -280px;
      animation: sweep 6s ease-in-out infinite alternate;
    }

    @keyframes swirl1 {
      0%   { transform: translate3d(-110px, -80px, 0) rotate(0deg) scale(0.9, 1.1);   opacity: 0.55; }
      50%  { transform: translate3d(80px, -20px, 0) rotate(75deg) scale(1.25, 0.9);  opacity: 0.85; }
      100% { transform: translate3d(-40px, 100px, 0) rotate(140deg) scale(1.0, 1.2); opacity: 0.6; }
    }
    @keyframes swirl2 {
      0%   { transform: translate3d(110px, 80px, 0) rotate(0deg) scale(1.1, 0.9);     opacity: 0.5; }
      50%  { transform: translate3d(-90px, 30px, 0) rotate(-80deg) scale(0.95, 1.25); opacity: 0.8; }
      100% { transform: translate3d(50px, -110px, 0) rotate(-150deg) scale(1.2, 1.0); opacity: 0.55; }
    }
    @keyframes sweep {
      0%   { transform: translate3d(-160px, 40px, 0) rotate(-15deg) scaleX(0.9); opacity: 0.35; }
      50%  { transform: translate3d(0px, -50px, 0) rotate(10deg) scaleX(1.3);    opacity: 0.7; }
      100% { transform: translate3d(160px, 30px, 0) rotate(25deg) scaleX(0.95);  opacity: 0.4; }
    }

    @media (max-width: 600px) {
      .fog-blob { filter: blur(30px); }
      .fog-1 {
        width: 300px; height: 200px; margin-top: -320px; margin-left: -150px;
        background: radial-gradient(ellipse at center, rgba(0, 160, 255, 0.85) 0%, rgba(0, 90, 200, 0.35) 50%, rgba(0, 0, 0, 0) 75%);
        animation: mobileSwirlTop 5.5s ease-in-out infinite alternate;
      }
      .fog-2 {
        width: 320px; height: 220px; margin-top: 120px; margin-left: -160px;
        background: radial-gradient(ellipse at center, rgba(145, 60, 255, 0.8) 0%, rgba(75, 20, 170, 0.35) 50%, rgba(0, 0, 0, 0) 75%);
        animation: mobileSwirlBottom 6.5s ease-in-out infinite alternate;
      }
      .fog-3 {
        width: 280px; height: 160px; margin-top: -80px; margin-left: -140px;
        background: radial-gradient(ellipse at center, rgba(0, 235, 255, 0.65) 0%, rgba(0, 130, 170, 0.25) 55%, rgba(0, 0, 0, 0) 75%);
        animation: mobileSweep 5s ease-in-out infinite alternate;
      }
      @keyframes mobileSwirlTop {
        0%   { transform: translate3d(-90px, -20px, 0) rotate(0deg) scale(0.85, 1.15); opacity: 0.6; }
        50%  { transform: translate3d(70px, 60px, 0) rotate(70deg) scale(1.2, 0.9);    opacity: 0.95; }
        100% { transform: translate3d(-40px, 110px, 0) rotate(130deg) scale(0.95, 1.1); opacity: 0.7; }
      }
      @keyframes mobileSwirlBottom {
        0%   { transform: translate3d(90px, 20px, 0) rotate(0deg) scale(1.1, 0.85);     opacity: 0.6; }
        50%  { transform: translate3d(-80px, -50px, 0) rotate(-75deg) scale(0.9, 1.2);  opacity: 0.95; }
        100% { transform: translate3d(40px, -110px, 0) rotate(-140deg) scale(1.15, 0.95); opacity: 0.65; }
      }
      @keyframes mobileSweep {
        0%   { transform: translate3d(-110px, -180px, 0) rotate(-20deg) scale(0.9); opacity: 0.4; }
        50%  { transform: translate3d(90px, 0px, 0) rotate(15deg) scale(1.25);      opacity: 0.85; }
        100% { transform: translate3d(-90px, 190px, 0) rotate(35deg) scale(0.95);   opacity: 0.5; }
      }
    }

    /* === 主卡片（加上頂部玻璃高光邊緣） === */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(20, 22, 28, 0.76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 12px 40px rgba(0, 0, 0, 0.65),
        0 0 35px rgba(0, 140, 255, 0.15);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .brand-header {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 32px;
    }
    .brand-logo { width: 95px; height: 32px; object-fit: contain; display: block; flex-shrink: 0; }
    .brand-text { font-size: 15px; font-weight: 600; color: #d0d4dc; line-height: 1.1; white-space: nowrap; }

    /* === 頂部雙分頁切換鈕 (Segmented Tabs) === */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      width: auto;
      padding: 9px 10px;
      background: transparent;
      color: #8892a0;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: none;
      transition: all 0.2s ease;
    }
    .tab-btn:hover:not(.active) { color: #d0d4dc; }
    .tab-btn.active {
      background: rgba(13, 110, 253, 0.26);
      color: #ffffff;
      border-color: rgba(13, 110, 253, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .tab-btn.active.green-tab {
      background: rgba(25, 135, 84, 0.32);
      border-color: rgba(32, 201, 151, 0.5);
    }

    h2 { margin-top: 0; margin-bottom: 16px; font-size: 22px; letter-spacing: 1px; }

    .countdown-box {
      background-color: rgba(42, 36, 23, 0.85);
      border: 1px solid #665222;
      color: #ffd43b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .countdown-timer { font-size: 17px; font-weight: bold; display: block; margin-top: 4px; }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      background-color: rgba(44, 48, 58, 0.75);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 17px;
      text-align: center;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 12px rgba(13, 110, 253, 0.35);
      outline: none;
    }
    input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0d6efd, #0052cc);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.35);
      transition: transform 0.15s;
    }
    .action-btn:active:not(:disabled) { transform: scale(0.98); }
    .action-btn:disabled { background: #444; color: #aaa; box-shadow: none; cursor: not-allowed; }

    .btn-green {
      background: linear-gradient(135deg, #198754, #146c43);
      box-shadow: 0 4px 15px rgba(25, 135, 84, 0.35);
    }
    .btn-cancel {
      background: #444;
      box-shadow: none;
      margin-top: 12px;
      padding: 10px;
      font-size: 15px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
      border: 2px solid #0d6efd;
    }

#msg {
      margin-top: 10px;
      font-size: clamp(13.5px, 3.8vw, 16px);
      font-weight: bold;
      min-height: 52px;
      line-height: 1.55;
      white-space: pre-line;
      text-wrap: balance;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ok { color: #20c997; }
    .err { color: #ff6b6b; }
#regView, #checkinView {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hidden { display: none !important; }

    .contact-footer {
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #8892a0;
    }
    .contact-footer a { color: #8ab4f8; text-decoration: none; }
    .contact-footer a:hover { text-decoration: underline; }
  </style>
</head>

    <!-- 雙分頁切換鈕 -->
    <div class="tabs">
      <button id="tabReg" class="tab-btn active" onclick="switchToReg()">1. 活動報名</button>

    <!-- ===== 畫面 1：報名表單 ===== -->
    <div id="regView">
      <h2>活動報名登記</h2>
      <div id="regCountdownBox" class="countdown-box">
        距離開放報名還有
        <span id="regCountdownTimer" class="countdown-timer">計算中...</span>
      </div>
      <input type="text" id="empId" inputmode="numeric" placeholder="請輸入您的工號" autocomplete="off">
      <input type="text" id="empName" placeholder="請輸入您的姓名" autocomplete="off">
      <button id="regBtn" class="action-btn" onclick="submitReg()">確認報名</button>
    </div>

<!-- ===== 畫面 2：現場掃碼報到 ===== -->
    <div id="checkinView" class="hidden">
      <h2>現場掃碼報到 (參加抽獎)</h2>
      <div id="checkinCountdownBox" class="countdown-box">
        距離開放現場報到還有
        <span id="checkinCountdownTimer" class="countdown-timer">計算中...</span>
      </div>
      <input type="text" id="checkinEmpId" inputmode="numeric" placeholder="請輸入您已報名的工號" autocomplete="off">

      <button id="checkinBtn" class="action-btn btn-green" onclick="startScanner()">📷 我要報到（掃描 QR Code）</button>

      <!-- 相機掃描區塊 -->
      <div id="reader"></div>
      <button id="cancelScanBtn" class="action-btn btn-cancel hidden" onclick="stopScanner()">取消掃描</button>
    </div>

  <script>
    const SUPABASE_URL = 'https://rsvdpldicrzpfajpugzl.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_hfNnuojQhFjjAvG4D1XwEA_Sj6iaZ4c';

    // ★ 請改成與 Supabase SQL 一致的台灣時間 (+08)
    const REG_OPEN_TIME = new Date('2026-11-27T00:00:00+08:00');
    const REG_OPEN_TEXT = '11/27 00:00';

    const CHECKIN_OPEN_TIME = new Date('2026-11-27T00:00:00+08:00');
    const CHECKIN_OPEN_TEXT = '11/27 00:00';

    const tabReg = document.getElementById('tabReg');
    const tabCheckin = document.getElementById('tabCheckin');
    const regView = document.getElementById('regView');
    const checkinView = document.getElementById('checkinView');
    const msgEl = document.getElementById('msg');

    const empIdInput = document.getElementById('empId');
    const empNameInput = document.getElementById('empName');
    const regBtn = document.getElementById('regBtn');
    const regCountdownBox = document.getElementById('regCountdownBox');
    const regCountdownTimer = document.getElementById('regCountdownTimer');

    const checkinEmpIdInput = document.getElementById('checkinEmpId');
    const checkinBtn = document.getElementById('checkinBtn');
    const checkinCountdownBox = document.getElementById('checkinCountdownBox');
    const checkinCountdownTimer = document.getElementById('checkinCountdownTimer');
    const readerEl = document.getElementById('reader');
    const cancelScanBtn = document.getElementById('cancelScanBtn');

    let isSubmitting = false;
    let html5QrCode = null;
    let isScanning = false;

    // 鍵盤 Enter 捷徑
    empIdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') empNameInput.focus();
    });
    empNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !regBtn.disabled) submitReg();
    });
    checkinEmpIdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !checkinBtn.disabled) startScanner();
    });

    function formatDiff(diff) {
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);
      const pad = (n) => String(n).padStart(2, '0');
      return days > 0
        ? `${days} 天 ${pad(hours)} 時 ${pad(minutes)} 分 ${pad(seconds)} 秒`
        : `${pad(hours)} 時 ${pad(minutes)} 分 ${pad(seconds)} 秒`;
    }

    function updateCountdowns() {
      const now = new Date();

      const regDiff = REG_OPEN_TIME - now;
      if (regDiff > 0) {
        regCountdownBox.style.display = 'block';
        regCountdownTimer.innerText = formatDiff(regDiff);
        empIdInput.disabled = true;
        empNameInput.disabled = true;
        regBtn.disabled = true;
        regBtn.innerText = `將於 ${REG_OPEN_TEXT} 開放報名`;
      } else {
        regCountdownBox.style.display = 'none';
        empIdInput.disabled = false;
        empNameInput.disabled = false;
        if (!isSubmitting) {
          regBtn.disabled = false;
          regBtn.innerText = '確認報名';
        }
      }

      const checkinDiff = CHECKIN_OPEN_TIME - now;
      if (checkinDiff > 0) {
        checkinCountdownBox.style.display = 'block';
        checkinCountdownTimer.innerText = formatDiff(checkinDiff);
        checkinEmpIdInput.disabled = true;
        checkinBtn.disabled = true;
        checkinBtn.innerText = `將於 ${CHECKIN_OPEN_TEXT} 開放報到`;
      } else {
        checkinCountdownBox.style.display = 'none';
        checkinEmpIdInput.disabled = false;
        if (!isSubmitting && !isScanning) {
          checkinBtn.disabled = false;
          checkinBtn.innerText = '📷 我要報到（掃描 QR Code）';
        }
      }
    }

    setInterval(updateCountdowns, 1000);
    updateCountdowns();

    function switchToCheckin(prefillEmpId = '') {
      stopScanner();
      msgEl.innerText = '';
      regView.classList.add('hidden');
      checkinView.classList.remove('hidden');
      tabReg.classList.remove('active');
      tabCheckin.classList.add('active', 'green-tab');
      if (prefillEmpId) {
        checkinEmpIdInput.value = prefillEmpId;
      }
      updateCountdowns();
    }

    function switchToReg() {
      stopScanner();
      msgEl.innerText = '';
      checkinView.classList.add('hidden');
      regView.classList.remove('hidden');
      tabCheckin.classList.remove('active', 'green-tab');
      tabReg.classList.add('active');
      updateCountdowns();
    }

    async function submitReg() {
      if (new Date() < REG_OPEN_TIME) {
        msgEl.className = 'err';
        msgEl.innerText = `尚未開放報名，\n將於 ${REG_OPEN_TEXT} 準時開放！`;
        return;
      }

      const empId = empIdInput.value.trim().toUpperCase();
      const empName = empNameInput.value.trim();

      if (!empId || !empName) {
        msgEl.className = 'err';
        msgEl.innerText = '請完整輸入工號與姓名';
        return;
      }

      isSubmitting = true;
      regBtn.disabled = true;
      regBtn.innerText = '登記報名資料中...';
      msgEl.innerText = '';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/checkins`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ emp_id: empId, name: empName })
        });

        if (response.status === 201) {
          empIdInput.value = '';
          empNameInput.value = '';
          switchToCheckin(empId);
          msgEl.className = 'ok';
          msgEl.innerText = `工號 ${empId} 報名成功！\n活動當天請點擊上方按鈕掃碼報到。`;
        } else if (response.status === 409) {
          switchToCheckin(empId);
          msgEl.className = 'err';
          msgEl.innerText = `工號 ${empId} 已經報名過了！\n已為您切換至報到畫面。`;
        } else if (response.status === 403 || response.status === 401) {
          msgEl.className = 'err';
          msgEl.innerText = `目前尚未開放報名\n（開放時間：${REG_OPEN_TEXT}）`;
        } else {
          msgEl.className = 'err';
          msgEl.innerText = `報名失敗 (錯誤碼 ${response.status})，\n請稍後再試`;
        }
      } catch (err) {
        msgEl.className = 'err';
        msgEl.innerText = '連線失敗，\n請檢查網路後再試一次';
      } finally {
        isSubmitting = false;
        updateCountdowns();
      }
    }

    async function startScanner() {
      if (new Date() < CHECKIN_OPEN_TIME) {
        msgEl.className = 'err';
        msgEl.innerText = `尚未開放報到，\n將於 ${CHECKIN_OPEN_TEXT} 準時開放！`;
        return;
      }

      const empId = checkinEmpIdInput.value.trim().toUpperCase();
      if (!empId) {
        msgEl.className = 'err';
        msgEl.innerText = '請先輸入您已報名的工號';
        return;
      }

      if (typeof Html5Qrcode === 'undefined') {
        msgEl.className = 'err';
        msgEl.innerText = '掃描模組載入中，\n請稍等兩秒再試一次';
        return;
      }

      msgEl.innerText = '';
      readerEl.style.display = 'block';
      cancelScanBtn.classList.remove('hidden');
      checkinBtn.classList.add('hidden');
      isScanning = true;

      try {
        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            stopScanner();
            submitCheckin(empId, decodedText);
          },
          () => {}
        );
      } catch (err) {
        stopScanner();
        msgEl.className = 'err';
        msgEl.innerText = '無法開啟相機！\n請允許相機權限，\n或改用 Chrome / Safari 開啟此網頁。';
      }
    }

    function stopScanner() {
      isScanning = false;
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => { html5QrCode = null; });
      }
      readerEl.style.display = 'none';
      cancelScanBtn.classList.add('hidden');
      checkinBtn.classList.remove('hidden');
      updateCountdowns();
    }

    async function submitCheckin(empId, qrText) {
      isSubmitting = true;
      checkinBtn.disabled = true;
      checkinBtn.innerText = '驗證報到中...';
      msgEl.innerText = '';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/do_checkin`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ p_emp_id: empId, p_secret: qrText })
        });

        if (!response.ok) {
          msgEl.className = 'err';
          msgEl.innerText = `報到失敗 (錯誤碼 ${response.status})，\n請稍後再試`;
          return;
        }

        const result = await response.json();
        if (result === 'OK') {
          msgEl.className = 'ok';
          msgEl.innerText = `🎉 工號 ${empId} 報到成功！\n祝您中大獎！`;
          launchConfetti();
        } else if (result === 'ALREADY_CHECKED_IN') {
          msgEl.className = 'ok';
          msgEl.innerText = `工號 ${empId} 已經完成報到了，\n請安心參與抽獎！`;
        } else if (result === 'NOT_FOUND') {
          msgEl.className = 'err';
          msgEl.innerText = `查無工號 ${empId} 的報名紀錄，\n請先完成報名！`;
        } else if (result === 'INVALID_QR') {
          msgEl.className = 'err';
          msgEl.innerText = '掃描的 QR Code 不正確，\n請掃描活動現場專屬報到碼！';
        } else if (result === 'NOT_OPEN') {
          msgEl.className = 'err';
          msgEl.innerText = `目前尚未開放報到\n（開放時間：${CHECKIN_OPEN_TEXT}）`;
        } else {
          msgEl.className = 'err';
          msgEl.innerText = '報到失敗，請稍後再試一次';
        }
      } catch (err) {
        msgEl.className = 'err';
        msgEl.innerText = '連線失敗，\n請檢查網路後再試一次';
      } finally {
        isSubmitting = false;
        updateCountdowns();
      }
    }

    // === 輕量級 Canvas 彩帶特效 ===
    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#008cff', '#00e1ff', '#ffd43b', '#20c997', '#ffffff'];
      const particles = Array.from({ length: 75 }, () => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 140,
        y: canvas.height * 0.45,
        vx: (Math.random() - 0.5) * 14,
        vy: Math.random() * -12 - 4,
        size: Math.random() * 7 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 12,
        opacity: 1
      }));

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // 重力
          p.vx *= 0.99; // 空氣阻力
          p.rotation += p.vRot;
          if (frame > 45) p.opacity -= 0.02;

          if (p.opacity > 0 && p.y < canvas.height + 20) {
            active = true;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            ctx.restore();
          }
        });

        frame++;
        if (active) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }
  </script>
