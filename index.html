    <h2>抽獎報到登記</h2>
    <input type="text" id="empId" placeholder="請輸入您的工號" autocomplete="off">
    <button id="submitBtn" onclick="submitForm()">確認登記</button>
    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rsvdpldicrzpfajpugzl.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_hfNnuojQhFjjAvG4D1XwEA_Sj6iaZ4c';

    document.getElementById('empId').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') submitForm();
    });

    async function submitForm() {
      const input = document.getElementById('empId');
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const empId = input.value.trim().toUpperCase();

      if (!empId) {
        msg.className = 'err';
        msg.innerText = '請先輸入工號';
        return;
      }

      btn.disabled = true;
      btn.innerText = '資料寫入中...';
      msg.innerText = '';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/checkins`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ emp_id: empId })
        });

        if (response.status === 201) {
          msg.className = 'ok';
          msg.innerText = `工號 ${empId} 登記成功！祝您中獎！`;
          input.value = '';
        } else if (response.status === 409) {
          msg.className = 'err';
          msg.innerText = `工號 ${empId} 已經登記過了，請勿重複送出！`;
        } else {
          msg.className = 'err';
          msg.innerText = `登記失敗 (錯誤碼 ${response.status})，請稍後再試`;
        }
      } catch (err) {
        msg.className = 'err';
        msg.innerText = '連線失敗，請檢查網路後再試一次';
      } finally {
        btn.disabled = false;
        btn.innerText = '確認登記';
      }
    }
  </script>
